name: CI / CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-matrix:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.22.x", "1.23.x", "1.24.x"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Lint
        if: matrix.go-version == '1.24.x'
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout 5m

      - name: Vet
        run: go vet ./...

      - name: Test with coverage
        run: |
          # Exclude examples/ — demo programs are not SDK code (parallels sdk-ts excluding src/index.ts).
          go list ./... | grep -v '/examples/' | xargs go test -race -coverprofile=coverage.out -covermode=atomic

      - name: Coverage gate
        if: matrix.go-version == '1.24.x'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 >= 85.0) ? 0 : 1 }' || {
            echo "Coverage ${total}% is below 85% threshold"; exit 1; }

      - name: Build
        run: go build ./...

      - name: Verify examples build
        run: |
          for dir in examples/*/; do
            echo "Building $dir"
            (cd "$dir" && go build .)
          done

  # 对外只暴露这一个固定的 check 名。矩阵 job 的 check 名会带上矩阵值
  # （ci (20.19.0)、ci (1.22.x) 之类），把那种名字登记成 ruleset 的必需检查会和矩阵硬耦合 ——
  # 版本清单一改，那条必需检查就永远不再上报，PR 会永久卡在 pending。
  #
  # if: always() 是必需的：矩阵失败时本 job 仍要运行并断言失败，否则它会被跳过，
  # 而被跳过的必需检查在 GitHub 眼里不等于失败。
  CI:
    needs: [ci-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总矩阵结果
        run: |
          echo "ci-matrix: ${{ needs.ci-matrix.result }}"
          [ "${{ needs.ci-matrix.result }}" = "success" ]

  publish:
    needs: CI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Trigger pkg.go.dev indexing
        run: |
          TAG="${GITHUB_REF##*/}"
          curl -fsSL "https://proxy.golang.org/github.com/waffo-com/waffo-pancake-sdk-go/@v/${TAG}.info" \
            || echo "proxy.golang.org indexing kicked off (may already be cached)"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping create."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "See [CHANGELOG.md](./CHANGELOG.md) for details." \
              --verify-tag
          fi
